name: Build jxrlib Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Visual Studio components
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Make (or with MSVC)
        run: |
          cd .
          # 如果 Makefile 可用于 Windows + mingw / msys
          mingw32-make   # 或 make depending on environment
          # 如果你 prefer MSVC，可以替换为 cl / … 命令

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: jxrlib-windows-build
          path: |
            ./bin/*.exe
            ./bin/*.dll
            ./bin/*.lib
